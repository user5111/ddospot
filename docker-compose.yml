services:
  ddospot:
    build:
      context: ./ddospot
    image: aelth/simpledns
    user: "0:0"
    cap_add:
      - CAP_NET_BIND_SERVICE
    environment:
      DDOSPOT_MAIL_HOST: ${DDOSPOT_MAIL_HOST:-}
      DDOSPOT_MAIL_PORT: ${DDOSPOT_MAIL_PORT:-}
      DDOSPOT_MAIL_USERNAME: ${DDOSPOT_MAIL_USERNAME:-}
      DDOSPOT_MAIL_PASSWORD: ${DDOSPOT_MAIL_PASSWORD:-}
      DDOSPOT_MAIL_SEC: ${DDOSPOT_MAIL_SEC:-}
      DDOSPOT_MAIL_FROM: ${DDOSPOT_MAIL_FROM:-}
      DDOSPOT_MAIL_TO: ${DDOSPOT_MAIL_TO:-}
    volumes:
      - ./ddospot/bl:/ddospot/bl
      - ./ddospot/db:/ddospot/db
      - ./ddospot/logs:/ddospot/logs
    ports:
      - target: 19
        published: 19
        protocol: udp
        mode: host
      - target: 53
        published: 53
        protocol: udp
        mode: host
      - target: 123
        published: 123
        protocol: udp
        mode: host
      - target: 161
        published: 161
        protocol: udp
        mode: host
      - target: 1900
        published: 1900
        protocol: udp
        mode: host

